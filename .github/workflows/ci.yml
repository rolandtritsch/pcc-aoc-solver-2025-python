name: Company checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.1"
      - run: uv python install 3.13.7
      - name: Workflow regressions
        run: uv run --python 3.13.7 --no-project python -B -m unittest discover -s skills/aoc-workflow/scripts/tests -v
      - name: Publication regressions
        run: uv run --python 3.13.7 --no-project python -B -m unittest discover -s skills/aoc-solve-python/scripts/tests -v
      - name: WatchDog regressions
        run: uv run --python 3.13.7 --no-project python -B -m unittest discover -s skills/aoc-watchdog/scripts/tests -v
